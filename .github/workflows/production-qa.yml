name: Production QA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  statuses: read
  checks: read
  deployments: read

concurrency:
  group: production-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  production-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_URL: https://tasksk001.vercel.app
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Detect tracked dependency lock
        id: lock_state
        shell: bash
        run: |
          if git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "tracked=true" >> "$GITHUB_OUTPUT"
          else
            echo "tracked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install project and QA dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.lock_state.outputs.tracked }}" == "true" ]]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi

      - name: Bootstrap deterministic package lock
        id: lock_bootstrap
        if: steps.lock_state.outputs.tracked == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Add deterministic dependency lock"
          git push origin HEAD:main
          echo "bootstrapped=true" >> "$GITHUB_OUTPUT"
          echo "A deterministic package-lock.json was committed. Dispatching QA on the new main commit." >> "$GITHUB_STEP_SUMMARY"
          gh workflow run production-qa.yml --ref main

      - name: Preserve resolved dependency lock
        if: steps.lock_bootstrap.outputs.bootstrapped != 'true'
        shell: bash
        run: |
          mkdir -p qa-artifacts
          cp package-lock.json qa-artifacts/package-lock.generated.json

      - name: Install Chromium
        if: steps.lock_bootstrap.outputs.bootstrapped != 'true'
        run: npx playwright install --with-deps chromium

      - name: Wait for Vercel deployment for this commit
        if: steps.lock_bootstrap.outputs.bootstrapped != 'true'
        shell: bash
        run: |
          set -uo pipefail
          echo "Waiting for Vercel result for commit ${GITHUB_SHA}"
          vercel_seen=0
          for attempt in $(seq 1 40); do
            status_state=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/status" --jq '[.statuses[] | select(.context | test("Vercel"; "i"))][0].state // ""' 2>/dev/null || true)
            check_state=$(gh api -H 'Accept: application/vnd.github+json' "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" --jq '[.check_runs[] | select(.name | test("Vercel"; "i"))][0].conclusion // ""' 2>/dev/null || true)

            if [[ "${status_state}" == "success" || "${check_state}" == "success" ]]; then
              echo "Vercel reports success for ${GITHUB_SHA}"
              vercel_seen=1
              break
            fi

            if [[ "${status_state}" == "failure" || "${status_state}" == "error" || "${check_state}" == "failure" || "${check_state}" == "cancelled" ]]; then
              echo "Vercel reports a failed deployment for ${GITHUB_SHA}"
              exit 1
            fi

            echo "Attempt ${attempt}/40: Vercel status not successful yet"
            sleep 15
          done

          if [[ "${vercel_seen}" -eq 0 ]]; then
            echo "Vercel commit metadata was not visible within the wait window; continuing with canonical URL verification."
          fi

      - name: Wait for canonical production URL
        if: steps.lock_bootstrap.outputs.bootstrapped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            code=$(curl -L -sS -o /tmp/project.html -w '%{http_code}' --max-time 25 "${PRODUCTION_URL}" || true)
            bytes=$(wc -c < /tmp/project.html 2>/dev/null || echo 0)
            if [[ "${code}" =~ ^[23][0-9][0-9]$ && "${bytes}" -gt 100 ]]; then
              echo "Production URL is live: HTTP ${code}, ${bytes} bytes"
              exit 0
            fi
            echo "Attempt ${attempt}/30: HTTP ${code:-n/a}, bytes ${bytes}"
            sleep 10
          done
          echo "Production URL did not become healthy in time"
          exit 1

      - name: Run multi-viewport production QA
        id: qa
        if: steps.lock_bootstrap.outputs.bootstrapped != 'true'
        run: npm run qa:production

      - name: Publish QA summary
        if: always() && steps.lock_bootstrap.outputs.bootstrapped != 'true'
        shell: bash
        run: |
          if [[ -f qa-artifacts/qa-summary.md ]]; then
            cat qa-artifacts/qa-summary.md >> "${GITHUB_STEP_SUMMARY}"
          else
            echo 'QA summary was not produced.' >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload QA evidence
        if: always() && steps.lock_bootstrap.outputs.bootstrapped != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: production-qa-${{ github.sha }}
          path: qa-artifacts/
          if-no-files-found: warn
          retention-days: 14
